<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// No-FOUC theme bootstrap — apply .dark before first paint. Mirrors $lib/theme.
			(function () {
				try {
					var s = localStorage.getItem('atlas-theme');
					var dark =
						s === 'dark' ||
						(s !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
